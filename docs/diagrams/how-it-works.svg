<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" role="img" aria-label="How Tayonx works: request, offers, accept, ship, track"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F80FF"/></marker></defs><rect x="1" y="1" width="1098" height="208" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="550" y="36" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1B2D" text-anchor="middle">How Tayonx works</text><rect x="28" y="62" width="180" height="100" rx="14" fill="#EEF5FF" stroke="#2F80FF" stroke-width="2"/><circle cx="118" cy="62" r="15" fill="#2F80FF"/><text x="118" y="67" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="118" y="112" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F1B2D" text-anchor="middle">Customer sends</text><text x="118" y="134" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F1B2D" text-anchor="middle">a request</text><line x1="212" y1="112" x2="240" y2="112" stroke="#2F80FF" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="244" y="62" width="180" height="100" rx="14" fill="#EEF5FF" stroke="#2F80FF" stroke-width="2"/><circle cx="334" cy="62" r="15" fill="#2F80FF"/><text x="334" y="67" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="334" y="112" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F1B2D" text-ancho